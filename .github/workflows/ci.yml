name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.cjs
      - run: python -m evals.evaluate --output evals/latest.json
      - run: python -m pip_audit -r requirements.lock --disable-pip --no-deps --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-python-${{ matrix.python }}
          path: evals/latest.json
